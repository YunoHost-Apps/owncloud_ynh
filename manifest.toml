#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "owncloud"
name = "ownCloud"
description.en = "Online storage, file sharing platform"
description.fr = "Stockage en ligne, plateforme de partage de fichiers"

version = "8.2.2~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "Apache-2.0"
website = "https://owncloud.com"
demo = "https://ocis.owncloud.com"
admindoc = "https://doc.owncloud.com/ocis/next/"
code = "https://github.com/owncloud/ocis"
cpe = "cpe:2.3:a:owncloud:owncloud"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = true

disk = "100M"
ram.build = "800M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["cs", "de", "en", "es", "fr", "gl", "it"]
    default = "fr"

    [install.password]
    type = "password"

[resources]

    [resources.sources.main]
    amd64.url = "https://github.com/owncloud/ocis/releases/download/v8.2.2/ocis-8.2.2-linux-amd64"
    amd64.sha256 = "33ea3e8ea44d8be12b7193163fcf110cadcef98b20252819f9836146be1d4804"
    arm64.url = "https://github.com/owncloud/ocis/releases/download/v8.2.2/ocis-8.2.2-linux-arm64"
    arm64.sha256 = "38fb9bef6840c6b2a528b351e3be181c87909284fc416b77013115892837b2a3"
    armhf.url = "https://github.com/owncloud/ocis/releases/download/v8.2.2/ocis-8.2.2-linux-arm"
    armhf.sha256 = "d4635b07b4847b03bb9e1bc238da6c69a3dbda04d7e80217765fe6d56e117b88"
    i386.url = "https://github.com/owncloud/ocis/releases/download/v8.2.2/ocis-8.2.2-linux-386"
    i386.sha256 = "8ef61f20b2b1abd02b123b6dc54fb6e7072ba71d71726e1fd8dc21a93d037840"
    in_subdir = false
    rename = "ocis"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^ocis-.*-linux-amd64$"
    autoupdate.asset.arm64 = "^ocis-.*-linux-arm64$"
    autoupdate.asset.armhf = "^ocis-.*-linux-arm$"
    autoupdate.asset.i386 = "^ocis-.*-linux-386$"

    [resources.system_user]
    allow_email = true
    
    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["config"]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false
    api.url = "/ocs"
    api.auth_header = false
    api.show_tile = false
    api.protected= true
    api.allowed = ["visitors"]

    [resources.ports]
