#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "owncloud"
name = "ownCloud"
description.en = "Online storage, file sharing platform"
description.fr = "Stockage en ligne, plateforme de partage de fichiers"

version = "8.2.1~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "Apache-2.0"
website = "https://owncloud.com"
demo = "https://ocis.owncloud.com"
admindoc = "https://doc.owncloud.com/ocis/next/"
code = "https://github.com/owncloud/ocis"
cpe = "cpe:2.3:a:owncloud:owncloud"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = true

disk = "100M"
ram.build = "800M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["cs", "de", "en", "es", "fr", "gl", "it"]
    default = "fr"

    [install.password]
    type = "password"

[resources]

    [resources.sources.main]
    amd64.url = "https://github.com/owncloud/ocis/releases/download/v8.2.1/ocis-8.2.1-linux-amd64"
    amd64.sha256 = "0c8dd7ca3bf901d62187d63ed62a62cd601ea99fd8596bf015bbf4e9fa94c720"
    arm64.url = "https://github.com/owncloud/ocis/releases/download/v8.2.1/ocis-8.2.1-linux-arm64"
    arm64.sha256 = "d553fe019f6be9040eac6586e16f5c1db27c0dfe2cef5d9701c66ac412f7aa30"
    armhf.url = "https://github.com/owncloud/ocis/releases/download/v8.2.1/ocis-8.2.1-linux-arm"
    armhf.sha256 = "5a1e2ebc0bce78aca6c352ae23b8f11cadb0390c4d2d97451cc4bd4870da41eb"
    i386.url = "https://github.com/owncloud/ocis/releases/download/v8.2.1/ocis-8.2.1-linux-386"
    i386.sha256 = "1cf9d74d059f1f425e9f4eae038ca114e5267f0571a692a9ee5b9d4cad4036d9"
    in_subdir = false
    rename = "ocis"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^ocis-.*-linux-amd64$"
    autoupdate.asset.arm64 = "^ocis-.*-linux-arm64$"
    autoupdate.asset.armhf = "^ocis-.*-linux-arm$"
    autoupdate.asset.i386 = "^ocis-.*-linux-386$"

    [resources.system_user]
    allow_email = true
    
    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["config"]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false
    api.url = "/ocs"
    api.auth_header = false
    api.show_tile = false
    api.protected= true
    api.allowed = ["visitors"]

    [resources.ports]
