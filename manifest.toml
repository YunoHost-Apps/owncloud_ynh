#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "owncloud"
name = "ownCloud"
description.en = "Online storage, file sharing platform"
description.fr = "Stockage en ligne, plateforme de partage de fichiers"

version = "8.2.4~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "Apache-2.0"
website = "https://owncloud.com"
demo = "https://ocis.owncloud.com"
admindoc = "https://doc.owncloud.com/ocis/next/"
code = "https://github.com/owncloud/ocis"
cpe = "cpe:2.3:a:owncloud:owncloud"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = true

disk = "100M"
ram.build = "800M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["cs", "de", "en", "es", "fr", "gl", "it"]
    default = "fr"

    [install.password]
    type = "password"

[resources]

    [resources.sources.main]
    amd64.url = "https://github.com/owncloud/ocis/releases/download/v8.2.4/ocis-8.2.4-linux-amd64"
    amd64.sha256 = "7e2e53f2eef22d0ae4591535dcdb03d08f7b996d70b11aec0b8349e32d0e3ed5"
    arm64.url = "https://github.com/owncloud/ocis/releases/download/v8.2.4/ocis-8.2.4-linux-arm64"
    arm64.sha256 = "f5330a994239b7164386251c34b791a68c89444ff0b14f31619b0485c5c04a0c"
    armhf.url = "https://github.com/owncloud/ocis/releases/download/v8.2.4/ocis-8.2.4-linux-arm"
    armhf.sha256 = "bc64dca65590f66d86988999b7db24e8a08cedf9da47ef25881428d75d85bea6"
    i386.url = "https://github.com/owncloud/ocis/releases/download/v8.2.4/ocis-8.2.4-linux-386"
    i386.sha256 = "9624f7866a220c684359f3fb862a8cf6c222edfb0a86499516925d808a924b8d"
    in_subdir = false
    rename = "ocis"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^ocis-.*-linux-amd64$"
    autoupdate.asset.arm64 = "^ocis-.*-linux-arm64$"
    autoupdate.asset.armhf = "^ocis-.*-linux-arm$"
    autoupdate.asset.i386 = "^ocis-.*-linux-386$"

    [resources.system_user]
    allow_email = true
    
    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["config"]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false
    api.url = "/ocs"
    api.auth_header = false
    api.show_tile = false
    api.protected= true
    api.allowed = ["visitors"]

    [resources.ports]
