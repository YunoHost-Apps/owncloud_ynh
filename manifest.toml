#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "owncloud"
name = "ownCloud"
description.en = "Online storage, file sharing platform"
description.fr = "Stockage en ligne, plateforme de partage de fichiers"

version = "8.0.2~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "Apache-2.0"
website = "https://owncloud.com"
demo = "https://ocis.owncloud.com"
admindoc = "https://doc.owncloud.com/ocis/next/"
code = "https://github.com/owncloud/ocis"
cpe = "cpe:2.3:a:owncloud:owncloud"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = true

disk = "100M"
ram.build = "800M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["cs", "de", "en", "es", "fr", "gl", "it"]
    default = "fr"

    [install.password]
    type = "password"

[resources]

    [resources.sources.main]
    amd64.url = "https://github.com/owncloud/ocis/releases/download/v8.0.2/ocis-8.0.2-linux-amd64"
    amd64.sha256 = "5263a3566d6645dc022657ca6426530b4baa4c788cead73a89cd8c31a6b1875f"
    arm64.url = "https://github.com/owncloud/ocis/releases/download/v8.0.2/ocis-8.0.2-linux-arm64"
    arm64.sha256 = "ecd03ad3fe541c393862637eb0382c6e017467dba459e585f2864e1e9488705b"
    armhf.url = "https://github.com/owncloud/ocis/releases/download/v8.0.2/ocis-8.0.2-linux-arm"
    armhf.sha256 = "0647271e6266fd5dcd5d22cf0c51b820206ed1f19c78c8a465faa2251842f7d1"
    i386.url = "https://github.com/owncloud/ocis/releases/download/v8.0.2/ocis-8.0.2-linux-386"
    i386.sha256 = "79082971b98ec2c970271715d16c261f5964acadb9780a513d6878fe3117200b"
    in_subdir = false
    rename = "ocis"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^ocis-.*-linux-amd64$"
    autoupdate.asset.arm64 = "^ocis-.*-linux-arm64$"
    autoupdate.asset.armhf = "^ocis-.*-linux-arm$"
    autoupdate.asset.i386 = "^ocis-.*-linux-386$"

    [resources.system_user]
    allow_email = true
    
    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["config"]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false
    api.url = "/ocs"
    api.auth_header = false
    api.show_tile = false
    api.protected= true
    api.allowed = ["visitors"]

    [resources.ports]
